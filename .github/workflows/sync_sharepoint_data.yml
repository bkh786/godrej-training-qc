name: Sync SharePoint Live Data

on:
  schedule:
    # Runs automatically every 2 hours (at 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual 1-click execution from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pyxlsb

      - name: Run SharePoint Data Synchronizer
        run: |
          python3 sync_datasets.py

      - name: Commit & Push Updated Datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html training.html m_score.html
          if git diff --staged --quiet; then
            echo "No data changes detected. Everything is up to date."
          else
            git commit -m "chore(data): auto-sync latest live SharePoint datasets [skip ci]"
            git push origin main
          fi
